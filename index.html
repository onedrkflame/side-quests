<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showroom kiosk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#e9efee; --panel:#ffffff; --panel2:#f1f6f5; --line:#c9d6d4; --text:#12302f; --muted:#52706d;
  --accent:#0d6b73; --accent-text:#ffffff; --ok:#1f8a55; --bad:#c2453b; --cell:#ffffff;
  --font:"Barlow Semi Condensed","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a171a; --panel:#122a2e; --panel2:#18363b; --line:#2a4a50; --text:#e4f0ee; --muted:#8fb0ab;
  --accent:#7fd6dc; --accent-text:#06262a; --ok:#2fa36b; --bad:#d9574c; --cell:#18363b;}}
:root[data-theme="dark"]{
  --bg:#0a171a; --panel:#122a2e; --panel2:#18363b; --line:#2a4a50; --text:#e4f0ee; --muted:#8fb0ab;
  --accent:#7fd6dc; --accent-text:#06262a; --ok:#2fa36b; --bad:#d9574c; --cell:#18363b;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:20px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:auto 1fr;height:100%}

/* Side menu */
.menu{width:300px;background:#df1c7f;color:#fff;border-right:1px solid #b0165f;display:flex;flex-direction:column;transition:width .25s ease;overflow:hidden}
.menu.collapsed{width:84px}
.brand{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.3);min-height:72px}
.brand-mark{flex:none;width:44px;height:44px;border-radius:12px;border:0;padding:0;background:#3b0a24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.brand-mark span{display:block;width:22px;height:3px;border-radius:2px;background:#fff}
.brand-name{font-weight:700;font-size:24px;line-height:1.1;white-space:nowrap}
.brand-name small{display:block;font-weight:400;font-size:15px;color:rgba(255,255,255,.85)}
.nav{flex:1;overflow-y:auto;padding:6px 12px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.group-title{margin:12px 10px 4px;text-align:center;font-size:26px;font-weight:700;line-height:1.1;color:#fff;white-space:normal}
.menu.collapsed .group-title,.menu.collapsed .brand-name,.menu.collapsed .label{display:none}
.item{display:flex;align-items:center;gap:16px;width:100%;min-height:50px;padding:6px 14px;margin-bottom:2px;border:1px solid transparent;border-radius:14px;background:transparent;justify-content:center;text-align:center;font-weight:500;white-space:nowrap}
.item .ico{flex:none;position:relative;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.4);display:grid;place-items:center;font-size:20px}
.item:active{transform:scale(.98)}
.item.complete .ico::after{content:"✓";position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#1f8a55;color:#fff;border:2px solid #fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.item[aria-current="true"]{background:#3b0a24;color:#fff}
.item[aria-current="true"] .ico{background:rgba(255,255,255,.2)}
.menu-foot{padding:12px;border-top:1px solid rgba(255,255,255,.3)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:20px;padding:14px 20px;background:#000;color:#fff;border-bottom:1px solid #333}
.topbar h1{margin:0;font-size:28px;font-weight:700;flex:1;line-height:1.15}
.score{display:flex;gap:18px;font-size:20px;font-weight:600;white-space:nowrap}
.score span b{font-size:26px}
.score .f b{color:#4cd48a} .score .m b{color:#ff7a6e}
.stage{position:relative;flex:1;min-height:0;background:#1a1a1a;overflow:hidden}

.scroll{position:absolute;inset:0;overflow:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(3,150px);grid-template-rows:repeat(8,150px);gap:8px;width:max-content;margin:0 auto}
.cell{min-width:0;min-height:0;border:2px solid var(--line);border-radius:12px;background:var(--cell);font-weight:600;
  font-size:42px;display:grid;place-items:center;position:relative;transition:background .15s,border-color .15s}
.cell:active:not([disabled]){transform:scale(.94)}
.cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.no{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .3s}
.cell.reveal{border:3px dashed var(--ok);color:var(--ok)}
.cell.ok::after,.cell.no::after{position:absolute;top:6px;right:12px;font-size:.5em}
.cell.ok::after{content:"✓"} .cell.no::after{content:"✕"}
.cell[disabled]{cursor:default}
.codebox{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:22px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-size:44px;font-weight:700}
.codebox.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-size:34px}
.codebox.no{background:var(--bad);border-color:var(--bad);color:#fff;font-size:36px;animation:shake .3s}
.key.fn{font-size:26px}
.gate{position:fixed;inset:0;z-index:15;display:none;place-items:center;background:#000;color:#fff;padding:24px;overflow:auto}
.gate.on{display:grid}
.gate h2{margin:0 0 28px;font-size:clamp(36px,6vw,64px);text-align:center;font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,150px);grid-auto-rows:150px;gap:8px;justify-content:center}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.done{position:fixed;inset:0;display:none;place-items:center;background:rgba(8,22,25,.78);z-index:5;text-align:center;padding:24px}
.done.on{display:grid}
.done-card{background:var(--panel);border-radius:24px;padding:36px 48px;border:1px solid var(--line)}
.done-card h2{margin:0 0 12px;font-size:72px;line-height:1.05}
.done-card p{margin:0 0 24px;font-size:22px;color:var(--muted)}
.done-card .btn{margin:0 auto}
.award{display:inline-flex;flex-direction:column;gap:4px;margin:0 0 22px;padding:14px 28px;border-radius:16px;background:#3b0a24;color:#ffd76a;font-size:28px;font-weight:700}
.award span{font-size:20px;font-weight:500;color:#fff}
.award[hidden]{display:none}
.award.wizard{background:#ffd76a;color:#3b0a24;font-size:36px;padding:18px 36px}
.award.wizard span{color:#3b0a24;font-size:28px;font-weight:700}

/* Action bar */
.actions{display:flex;gap:12px;padding:14px 20px;background:#000;border-top:1px solid #333;overflow-x:auto}
.btn{flex:1 0 auto;min-width:130px;min-height:68px;padding:10px 22px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:21px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.actions .btn:not(.primary){background:#1e1e1e;color:#fff;border-color:#444}

/* Attract */
.attract{position:fixed;inset:0;z-index:20;display:none;place-items:center;text-align:center;padding:24px;background:rgba(8,22,25,.94);color:#e4f0ee;backdrop-filter:blur(6px)}
.attract.on{display:grid}
.attract h2{font-size:clamp(72px,14vw,260px);line-height:1;margin:0 0 clamp(40px,8vw,120px);font-weight:700}
.attract p{margin:0;font-size:24px;color:#9cc2bd;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

@media (max-width:760px){
  .menu{width:84px}.menu .group-title,.menu .brand-name,.menu .label{display:none}
  .topbar{flex-direction:column;align-items:flex-start;gap:6px}.topbar h1{font-size:21px}.score{font-size:16px}.score span b{font-size:20px}
  .stage{padding:8px}.grid{gap:4px}.btn{min-width:110px;font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="menu" id="menu" aria-label="Main menu">
    <div class="brand"><button class="brand-mark" id="collapse" aria-label="Collapse menu" aria-expanded="true"><span></span><span></span><span></span></button><div class="brand-name">Grid quiz<small>Tap the right answers</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="menu-foot"><button class="item" id="resetProg"><span class="ico">🔄</span><span class="label">Reset progress</span></button><button class="item" id="logout"><span class="ico">💾</span><span class="label">Save progress</span></button></div>
    
  </aside>

  <section class="main">
    <header class="topbar">
      <h1 id="prompt">Choose a topic</h1>
      <div class="score" aria-live="polite"><span class="f">Found <b id="found">0</b> of <b id="total">0</b></span><span class="m">Misses <b id="misses">0</b></span></div>
    </header>
    <div class="stage">
      <div class="wave" aria-hidden="true"></div>
      <div class="scroll"><div class="grid" id="grid"></div></div>
      <div class="done" id="done"><div class="done-card"><div class="award" id="award" hidden><b>🏆 New achievement unlocked</b><span id="achName"></span></div><h2 id="doneTitle">All found!</h2><p id="doneText"></p><button class="btn primary" id="doneNext">Next topic</button></div></div>
    </div>
    <div class="actions" id="actions">
      <button class="btn primary" id="again">Start over</button>
      
      <button class="btn" id="next">Next topic</button>
    </div>
  </section>
</div>
<div class="gate" id="gate"><div class="gate-inner"><h2>Enter your code</h2><div class="keys" id="gateKeys"></div></div></div>
<div class="attract" id="attract"><div><h2>Side quests</h2><p id="attractMsg">Touch to begin</p></div></div>

<script>
const IDLE_SECONDS = 90;   // return to the first topic and show "Touch to begin". 0 = off.
const N = 24;              // 3 columns x 8 rows

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nums = () => Array.from({ length: N }, (_, i) => i + 1);
const isPrime = n => n > 1 && Array.from({ length: Math.floor(Math.sqrt(n)) - 1 }, (_, i) => i + 2).every(d => n % d);

/* A topic builds a round: 24 cell labels and the set of labels that are correct.
   Add your own: build() just has to return { cells: [24 labels], correct: Set(labels) }. */
const numTopic = (id, icon, label, prompt, test, jumble) => ({ id, icon, label, prompt,
  build: () => { const cells = jumble ? shuffle(nums()) : nums(); return { cells, correct: new Set(cells.filter(test)) }; } });

const ANIMALS = ["Cat","Dog","Fox","Owl","Elk","Cow","Pig","Hen","Ram","Ape","Bee","Eel","Yak","Emu","Rat","Ant","Cod","Gnu"];
const OTHERS = ["Sun","Pen","Cup","Hat","Car","Box","Key","Map","Bed","Jar","Tea","Ice","Bag","Fan","Pie","Net","Oak","Rug","Toy","Pot","Bus","Gem","Ink","Lid","Mug","Nut","Oar","Pan","Rod","Saw","Tap","Urn","Van","Web","Zip","Axe","Bow","Cap","Dye","Egg","Fig","Gum","Hub","Jug","Kit","Log","Mat","Nib","Orb","Peg","Pin","Rim","Sip","Tin","Wax","Yam","Zoo"];

const MENU = [
  { group: "Numbers", items: [
    numTopic("m6", "6️⃣", "Times table of 6", "Tap every number in the 6 times table", n => n % 6 === 0, true),
    numTopic("m9", "9️⃣", "Times table of 9", "Tap every number in the 9 times table", n => n % 9 === 0, true),
    numTopic("pr", "🔢", "Prime numbers", "Tap every prime number", isPrime),
    numTopic("sq", "⬛", "Square numbers", "Tap every square number", n => Number.isInteger(Math.sqrt(n))),
  ]},
  { group: "Words", items: [
    { id: "an", icon: "🐾", label: "Animals", prompt: "Tap every animal",
      build: () => { const good = shuffle(ANIMALS).slice(0, 8); const cells = shuffle(good.concat(shuffle(OTHERS).slice(0, N - good.length))); return { cells, correct: new Set(good) }; } },
  ]},
];
const PLACES = ["Bank", "Park", "Shop", "Cafe", "Pool", "Mall", "Gym", "Zoo", "Pier", "Inn"];
const RIDES = ["Bus", "Van", "Car", "Bike", "Taxi", "Tram", "Cab", "Jeep"];
const townTopic = (id, icon, label, prompt, good) => ({ id, icon, label, prompt,
  build: () => {
    const keep = shuffle(good).slice(0, 8);
    const skip = new Set([...ANIMALS, ...PLACES, ...RIDES]);
    const rest = shuffle(OTHERS.filter(w => !skip.has(w))).slice(0, N - keep.length);
    return { cells: shuffle(keep.concat(rest)), correct: new Set(keep) };
  } });
MENU.push({ group: "Things around the city", items: [
  townTopic("pl", "🏙️", "Places", "Tap every place in town", PLACES),
  townTopic("rd", "🚌", "Getting around", "Tap everything you can ride", RIDES),
]});

const TOPICS = MENU.flatMap(g => g.items);
TOPICS.forEach(t => { t.maxMisses = 3; });   // wrong answers allowed before game over

let topic = TOPICS[0], round, found, misses, failTimer, doneAction = null;
const NUMBER_IDS = ["m6", "m9", "pr", "sq"], completed = new Set();
let wizardDone = false;
let fails = 0, lockedUntil = 0, strikes = 0;
let currentCode = null;
let partial = {};   // topic id -> { cells, correct, found, wrong } for a quiz that is part way done
const codeStrikes = {};     // code -> 0 or 1 (1 = already had its 1 minute lock)
const blockedCodes = {};   // code -> time it unlocks again   // two game-overs in a row = 5 second lockout

/* ---------- Build the menu ---------- */
MENU.forEach(g => {
  const t = document.createElement("div"); t.className = "group-title"; t.textContent = g.group; $("nav").appendChild(t);
  g.items.forEach(it => {
    const b = document.createElement("button"); b.className = "item"; b.dataset.id = it.id; b.title = it.label;
    b.innerHTML = '<span class="ico">' + it.icon + '</span><span class="label">' + it.label + '</span>';
    b.addEventListener("click", () => start(it));
    $("nav").appendChild(b);
  });
});

/* ---------- Game ---------- */
function start(t, fresh, keepCheck) {
  topic = t || topic; clearTimeout(failTimer); $("award").hidden = true; doneAction = nextTopic; $("doneNext").textContent = "Next topic"; $("doneNext").style.display = "";
  const saved = !fresh && partial[topic.id];
  if (saved) { round = { cells: saved.cells, correct: new Set(saved.correct) }; found = saved.found.length; misses = saved.wrong.length; }
  else {
    round = topic.build(); found = 0; misses = 0;
    if (!keepCheck) document.querySelector('#nav [data-id="' + topic.id + '"]').classList.remove("complete");   // a brand new round is not complete
    partial[topic.id] = { cells: round.cells, correct: [...round.correct], found: [], wrong: [] };
  }
  document.querySelectorAll("#nav .item").forEach(b => b.removeAttribute("aria-current"));
  document.querySelector('#nav [data-id="' + topic.id + '"]').setAttribute("aria-current", "true");
  $("prompt").textContent = topic.prompt; $("done").classList.remove("on");
  const grid = $("grid"); grid.innerHTML = "";
  round.cells.forEach(label => {
    const c = document.createElement("button"); c.className = "cell"; c.textContent = label;
    if (saved) {
      if (saved.found.includes(label)) { c.classList.add("ok"); c.disabled = true; }
      else if (saved.wrong.includes(label)) { c.classList.add("no"); c.disabled = true; }
    }
    c.addEventListener("click", () => pick(c, label));
    grid.appendChild(c);
  });
  score();
}

/* ---------- Keypad ---------- */
const CODES = {
  "6902": { message: "Code accepted ✓" }, "4890": { message: "Code accepted ✓" },
  "0738": { message: "Code accepted ✓" }, "7576": { message: "Code accepted ✓" },
  "4878": { message: "Code accepted ✓" }, "9611": { message: "Code accepted ✓" },
  "8597": { message: "Code accepted ✓" }, "3748": { message: "Code accepted ✓" },
  "5810": { message: "Code accepted ✓" }, "4142": { message: "Code accepted ✓" },
  "9929": { message: "Code accepted ✓" }, "9572": { message: "Code accepted ✓" },
  "8654": { message: "Code accepted ✓" }, "4454": { message: "Code accepted ✓" },
  "4725": { message: "Code accepted ✓" }, "6722": { message: "Code accepted ✓" },
  "9875": { message: "Code accepted ✓" },
  "1200": { message: "Code accepted ✓" },   // add future 4-digit codes here, e.g. "3456": { message: "..." }
};
let entry = "", codeLock = false, codeTimer;

function showEntry() {
  const box = $("codebox"); if (!box) return;
  box.className = "codebox"; box.innerHTML = "";
  for (let i = 0; i < 4; i++) { const d = document.createElement("span"); d.textContent = i < entry.length ? entry[i] : "\u25cb"; box.appendChild(d); }
}

function showGate() {
  const g = $("gateKeys"); g.innerHTML = "";
  buildKeypad(g);
  $("gate").classList.add("on");
}

function buildKeypad(grid) {
  clearTimeout(codeTimer); entry = ""; codeLock = false;
  const box = document.createElement("div"); box.id = "codebox"; box.setAttribute("aria-live", "polite");
  grid.appendChild(box); showEntry();
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", "Clear", "0", "\u232b"].forEach(k => {
    const b = document.createElement("button");
    b.className = "cell key" + (k.length > 1 || k === "\u232b" ? " fn" : ""); b.textContent = k;
    b.setAttribute("aria-label", k === "\u232b" ? "Backspace" : k);
    b.addEventListener("click", () => press(k));
    grid.appendChild(b);
  });
}

function press(k) {
  if (codeLock) return;
  if (k === "Clear") entry = "";
  else if (k === "\u232b") entry = entry.slice(0, -1);
  else if (entry.length < 4) entry += k;
  showEntry();
  if (entry.length === 4) checkCode();
}

function checkCode() {
  codeLock = true;
  const locked = (blockedCodes[entry] || 0) > Date.now();
  const hit = locked ? null : CODES[entry], box = $("codebox");
  box.innerHTML = "";
  if (hit) { currentCode = entry; fails = 0; loadProgress(entry); box.className = "codebox ok"; box.textContent = hit.message; }
  else { box.className = "codebox no"; box.textContent = locked ? "Code locked" : "Wrong code"; }
  codeTimer = setTimeout(() => {
    entry = ""; codeLock = false;
    if (hit) { $("gate").classList.remove("on"); start(TOPICS[0], false, true); } else showEntry();
  }, hit ? 1500 : 1400);
}

/* ---------- Saved wins (kept per code, so logging out never loses them) ---------- */
const store = (() => { try { return JSON.parse(localStorage.getItem("sideQuestsProgress") || "{}"); } catch (e) { return {}; } })();
function saveProgress() { try { localStorage.setItem("sideQuestsProgress", JSON.stringify(store)); } catch (e) {} }

function dropPartial(id) {          // a finished or lost quiz no longer has anything part way done
  delete partial[id];
  const p = currentCode && store[currentCode];
  if (p && p.partial && p.partial[id]) { delete p.partial[id]; saveProgress(); }
}
function savePartial() {            // called by the Save progress button
  if (!currentCode) return;
  const p = store[currentCode] || (store[currentCode] = { won: [], perfect: [], wizard: false });
  p.partial = {};
  Object.keys(partial).forEach(id => {
    const x = partial[id];
    if (x.found.length || x.wrong.length) p.partial[id] = { cells: x.cells, correct: x.correct, found: x.found.slice(), wrong: [] };   // wrong taps are not kept
  });
  saveProgress();
}

function loadProgress(code) {
  const p = store[code] || { won: [], perfect: [], wizard: false };
  partial = JSON.parse(JSON.stringify(p.partial || {}));
  Object.keys(partial).forEach(id => { partial[id].wrong = []; });   // also clears wrong taps saved by an earlier version
  completed.clear(); p.perfect.forEach(id => completed.add(id)); wizardDone = !!p.wizard;
  document.querySelectorAll("#nav .item.complete").forEach(b => b.classList.remove("complete"));
  p.won.forEach(id => {
    const x = partial[id], started = x && (x.found.length || x.wrong.length);   // saved part way through = not complete right now
    const b = document.querySelector('#nav [data-id="' + id + '"]'); if (b && !started) b.classList.add("complete");
  });
}

function pick(c, label) {
  if (c.disabled) return;
  c.disabled = true;
  const mi = document.querySelector('#nav [data-id="' + topic.id + '"]'); if (mi) mi.classList.remove("complete");   // a round in progress is not complete; finish() puts the check back
  if (round.correct.has(label)) {
    c.classList.add("ok"); found++; if (partial[topic.id]) partial[topic.id].found.push(label);
    if (found === round.correct.size) finish();
  } else { c.classList.add("no"); misses++; if (partial[topic.id]) partial[topic.id].wrong.push(label); if (topic.maxMisses && misses >= topic.maxMisses) { score(); fail(); return; } }
  score();
}

function score() { $("found").textContent = found; $("total").textContent = round.correct.size; $("misses").textContent = misses + (topic.maxMisses ? "/" + topic.maxMisses : ""); }

function finish() {
  dropPartial(topic.id);
  fails = 0; if (currentCode) codeStrikes[currentCode] = 0;
  $("award").hidden = misses > 0;
  document.querySelector('#nav [data-id="' + topic.id + '"]').classList.add("complete");
  if (misses === 0) completed.add(topic.id);
  const wizard = misses === 0 && !wizardDone && NUMBER_IDS.includes(topic.id) && NUMBER_IDS.every(id => completed.has(id));
  if (wizard) wizardDone = true;
  if (currentCode) {
    const p = store[currentCode] || (store[currentCode] = { won: [], perfect: [], wizard: false });
    if (!p.won.includes(topic.id)) p.won.push(topic.id);
    if (misses === 0 && !p.perfect.includes(topic.id)) p.perfect.push(topic.id);
    p.wizard = wizardDone;
    saveProgress();
  }
  $("award").classList.toggle("wizard", wizard);
  $("award").firstElementChild.textContent = wizard ? "🧙 Achievement unlocked" : "🏆 New achievement unlocked";
  $("achName").textContent = wizard ? "You’re a number wizard!" : topic.label + " complete";
  $("doneTitle").textContent = "You did it! 🎉";
  $("doneText").textContent = misses === 0 ? "Perfect round, no wrong taps." : "You found all " + found + " with " + misses + (misses === 1 ? " wrong tap." : " wrong taps.");
  setTimeout(() => $("done").classList.add("on"), 500);
}

function lockout() {
  fails = 0; partial = {}; start(TOPICS[0]);
  $("attract").classList.add("on");
  if (currentCode) {
    if ((codeStrikes[currentCode] || 0) > 0) { blockedCodes[currentCode] = Date.now() + 5 * 60 * 1000; codeStrikes[currentCode] = 0; }
    else { blockedCodes[currentCode] = Date.now() + 60 * 1000; codeStrikes[currentCode] = 1; }
  }
  currentCode = null;
  $("attractMsg").textContent = "Touch to begin";
}

function fail() {
  dropPartial(topic.id);
  document.querySelectorAll("#grid .cell").forEach(c => { c.disabled = true; });
  $("doneTitle").textContent = "Game over";
  $("doneText").textContent = topic.maxMisses + " wrong answers. Starting again…";
  $("doneNext").textContent = "Try again";
  doneAction = () => start();
  setTimeout(() => $("done").classList.add("on"), 400);
  fails++;
  const tier2 = (codeStrikes[currentCode] || 0) > 0;   // locked before = next fail is the 5 minute one
  if (fails >= (tier2 ? 1 : 2)) {
    $("doneText").textContent = tier2 ? "Too many tries. This code is locked for 5 minutes." : "Two games in a row. This code is locked for 1 minute.";
    $("doneNext").style.display = "none";
    failTimer = setTimeout(lockout, 2500);
    return;
  }
  failTimer = setTimeout(() => start(), 3500);
}

function reveal() {
  document.querySelectorAll("#grid .cell").forEach(c => { if (!c.disabled && round.correct.has(c.textContent)) c.classList.add("reveal"); });
}

function nextTopic() { const q = TOPICS.filter(t => !t.keypad); start(q[(q.indexOf(topic) + 1) % q.length]); }

$("again").addEventListener("click", () => start(undefined, true));

$("next").addEventListener("click", nextTopic);
$("doneNext").addEventListener("click", () => doneAction());
$("collapse").addEventListener("click", () => {
  const c = $("menu").classList.toggle("collapsed");
  $("collapse").setAttribute("aria-expanded", String(!c));
  $("collapse").setAttribute("aria-label", c ? "Expand menu" : "Collapse menu");
});

/* ---------- Kiosk behavior ---------- */
document.addEventListener("contextmenu", e => e.preventDefault());
let idleTimer;
function logout() {
  savePartial(); partial = {};
  clearTimeout(idleTimer); clearTimeout(failTimer);
  completed.clear(); wizardDone = false; fails = 0; strikes = 0;
  document.querySelectorAll("#nav .item.complete").forEach(b => b.classList.remove("complete"));
  $("done").classList.remove("on");
  $("attract").classList.add("on");
  start(TOPICS[0]);
}
$("logout").addEventListener("click", logout);

/* Reset progress: two taps (tap, then confirm) so it can't be hit by accident */
let resetArmed = false, resetTimer;
function disarmReset() { resetArmed = false; clearTimeout(resetTimer); $("resetProg").querySelector(".label").textContent = "Reset progress"; }
$("resetProg").addEventListener("click", () => {
  if (!resetArmed) {
    resetArmed = true; $("resetProg").querySelector(".label").textContent = "Tap again to confirm";
    resetTimer = setTimeout(disarmReset, 4000); return;
  }
  disarmReset();
  if (currentCode) { delete store[currentCode]; saveProgress(); }
  partial = {}; completed.clear(); wizardDone = false;
  document.querySelectorAll("#nav .item.complete").forEach(b => b.classList.remove("complete"));
  $("done").classList.remove("on");
  start(undefined, true);
});
function wake() {
  if (Date.now() < lockedUntil) return;
  if ($("attract").classList.contains("on")) showGate();
  $("attract").classList.remove("on");
  if (!IDLE_SECONDS) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { $("attract").classList.add("on"); partial = {}; completed.clear(); wizardDone = false; fails = 0; strikes = 0; document.querySelectorAll("#nav .item.complete").forEach(b => b.classList.remove("complete")); start(TOPICS[0]); }, IDLE_SECONDS * 1000);
}
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, wake, true));
start(TOPICS[0]); $("attract").classList.add("on");
</script>
</body>
</html>
